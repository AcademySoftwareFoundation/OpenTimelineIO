codecov:
  # Wait for both the C++ and Python coverage uploads
  notify:
    after_n_builds: 2
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...95"

  status:
    project: yes
    patch: yes
    changes: yes

comment:
  layout: "reach, diff, flags, files, footer"
  behavior: default
  require_changes: no
  after_n_builds: 2

ignore:
  - "*aaf2*"
  - "*pkg_resources*"
  - "*pbr*"
  - "*mock*"
  - "*PIL*"
  - "*funcsigs*"
  - "/usr/*"
  - "*/deps/*"
