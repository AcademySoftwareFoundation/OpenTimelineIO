# https://github.com/actions/labeler#common-examples

release-candidate:
- changed-files:
  - any-glob-to-any-file: 'CHANGELOG.md'

submodules:
- changed-files:
  - any-glob-to-any-file: 'src/deps/**'

dependencies:
- changed-files:
  - any-glob-to-any-file: 'pyproject.toml'

ci:
- changed-files:
  - any-glob-to-any-file: '.github/**'

documentation:
- changed-files:
  - any-glob-to-any-file: 'docs/**'

opentime:
- changed-files:
  - any-glob-to-any-file: 'src/opentime/**'

time calculations:
- changed-files:
  - any-glob-to-any-file: 'src/opentime/**'

python-bindings:
- changed-files:
  - any-glob-to-any-file: 'src/py-opentimelineio/**'
