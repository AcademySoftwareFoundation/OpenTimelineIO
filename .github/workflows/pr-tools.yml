name: Pull Request Tools

on:
  workflow_run:
    workflows: [Pull Request Label Signal]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: 'PR number to label (open or merged)'
        type: string
        required: true

permissions: {}

jobs:
  label:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.path == '.github/workflows/pr-labels.yml' &&
        github.event.workflow_run.repository.id == github.event.repository.id))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No checkout, artifacts, or caches: PR metadata is data, never code.
      - name: Find current pull requests
        id: prs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const repository = context.payload.repository;
            let candidates;
            const manual = context.eventName === 'workflow_dispatch';
            const headSha = context.payload.workflow_run?.head_sha;
            if (manual) {
              const input = context.payload.inputs['pull-request'];
              if (!/^[1-9][0-9]*$/.test(input) || !Number.isSafeInteger(Number(input))) {
                throw new Error('Expected a positive integer PR number');
              }
              candidates = [{number: Number(input)}];
            } else {
              if (!/^[0-9a-f]{40}$/.test(headSha ?? '')) {
                throw new Error('Invalid head SHA in labeling signal');
              }
              // Fork runs may have no workflow_run.pull_requests association.
              candidates = (await github.paginate(github.rest.pulls.list, {
                ...context.repo, state: 'open', per_page: 100,
              })).filter(pr => pr.head.sha === headSha);
            }
            const numbers = [];
            for (const candidate of candidates) {
              const {data: pr} = await github.rest.pulls.get({
                ...context.repo, pull_number: candidate.number,
              });
              if (pr.base.repo.id !== repository.id ||
                  !(pr.state === 'open' || (manual && pr.merged_at)) ||
                  (!manual && pr.head.sha !== headSha)) continue;
              // GitHub's files endpoint cannot return more than 3,000 files.
              if (pr.changed_files > 3000) {
                core.warning(`Skipping PR #${pr.number}: file list would be incomplete`);
                continue;
              }
              numbers.push(pr.number);
            }
            core.setOutput('numbers', numbers.join('\n'));
            if (numbers.length) {
              // This labeler commit double-encodes slashes in remote config
              // paths. Fetch only the trusted YAML using a literal API path.
              const {data} = await github.request(
                'GET /repos/{owner}/{repo}/contents/.github/labeler.yml',
                {...context.repo, ref: context.sha},
              );
              require('node:fs').writeFileSync(
                require('node:path').join(process.env.RUNNER_TEMP, 'otio-labeler.yml'),
                Buffer.from(data.content, 'base64'),
              );
            }

      - name: Apply file labels incrementally
        if: steps.prs.outputs.numbers != ''
        # Post-v7.0.0 fix: selective additions/removals preserve other labels.
        # https://github.com/actions/labeler/pull/957
        uses: actions/labeler@b7a88044754812b108a54feec878dd5c328bba59
        with:
          pr-number: ${{ steps.prs.outputs.numbers }}
          configuration-path: ${{ runner.temp }}/otio-labeler.yml
          sync-labels: true
          dot: true
