# Run the C++ tests with AddressSanitizer and UndefinedBehaviorSanitizer to
# find memory errors, leaks, and undefined behavior.

name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 07:45 UTC.
    - cron: "45 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  asan_ubsan:
    name: ASan + UBSan
    runs-on: ubuntu-24.04

    env:
      SANITIZER_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1:strict_init_order=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: "recursive"
      - name: Install ZLIB
        run: sudo apt-get install -y zlib1g-dev
      - name: Build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="$SANITIZER_FLAGS" \
            -DCMAKE_CXX_FLAGS="$SANITIZER_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build -j 4
      - name: Run tests
        run: ctest --test-dir build --output-on-failure -j 4
