name: VFX Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 07:31 UTC.
    - cron: "31 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vfx_platform:
    name: VFX Platform ${{ matrix.platform }} (C++${{ matrix.cxx-standard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep every year in VERSIONS.md covered with the ASWF toolchain.
          - platform: "2023"
            cxx-standard: 17
          - platform: "2024"
            cxx-standard: 17
          - platform: "2025"
            cxx-standard: 17
          - platform: "2026"
            cxx-standard: 20
          - platform: "2027"
            cxx-standard: 20

    # Never replace the Reference Platform interpreter with a uv-managed build.
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_NO_MANAGED_PYTHON: "1"

    container:
      image: aswf/ci-otio:${{ matrix.platform }}

    steps:
      # checkout *without* submodules, so we'll pick up the dependencies in the aswf containers
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Some image tags do not expose uv on PATH. Install only the tool;
      # UV_NO_MANAGED_PYTHON keeps the container's interpreter authoritative.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Report platform toolchain
        run: |
          echo "VFX platform: ${ASWF_VFXPLATFORM_VERSION}"
          python --version
          gcc --version
          g++ --version
          cmake --version
          uv --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_STANDARD=${{ matrix.cxx-standard }} \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DOTIO_AUTOMATIC_SUBMODULES=OFF \
            -DOTIO_CXX_EXAMPLES=OFF \
            -DOTIO_DEPENDENCIES_INSTALL=OFF \
            -DOTIO_FIND_IMATH=ON \
            -DOTIO_FIND_PYBIND11=ON \
            -DOTIO_FIND_RAPIDJSON=ON \
            -DOTIO_FIND_MINIZIP_NG=ON \
            -DOTIO_PYTHON_INSTALL=ON \
            -DOTIO_PYTHON_INSTALL_DIR="$GITHUB_WORKSPACE/install/python"

      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Install and run consumer tests
        run: |
          cmake --install build
          cmake -S tests/consumer -B consumer-build \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install"

      - name: Verify Python bindings
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/install/python" \
            python -c 'import opentimelineio; print(opentimelineio.__file__)'

      - name: Run Python tests
        run: |
          export CMAKE_ARGS="-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_STANDARD=${{ matrix.cxx-standard }} -DOTIO_AUTOMATIC_SUBMODULES=OFF -DOTIO_CXX_EXAMPLES=OFF -DOTIO_DEPENDENCIES_INSTALL=OFF -DOTIO_FIND_IMATH=ON -DOTIO_FIND_PYBIND11=ON -DOTIO_FIND_RAPIDJSON=ON -DOTIO_FIND_MINIZIP_NG=ON"
          # Always compile against this year's libraries, even if another
          # platform year shares its Python ABI and the uv dependency cache.
          uv sync --locked --no-editable --no-default-groups --group test --reinstall-package opentimelineio --python "$(python -c 'import sys; print(sys.executable)')"
          make test UV_RUN="uv run --no-sync"
