name: VFX Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 07:31 UTC.
    - cron: "31 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vfx_platform:
    name: VFX Platform ${{ matrix.platform }} (C++${{ matrix.cxx-standard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # CY2023--CY2026 are covered by OTIO's support policy. CY2027 is
          # included as forward-looking support.
          - platform: "2023"
            cxx-standard: 17
            image: "aswf/ci-otio:2023@sha256:888156204e68f3ced0ff277157423852c9330f0eed48419361a67fbf5ab48a53"
          - platform: "2024"
            cxx-standard: 17
            image: "aswf/ci-otio:2024@sha256:e5cf8b39c930258aa447a3e19f2f085cd231ff6433ab1d33ae2067c2e62c9853"
          - platform: "2025"
            cxx-standard: 17
            image: "aswf/ci-otio:2025@sha256:2253b4e8ec4e231874f5b5a0e623f58ba50b758578a87404b670cc004c033417"
          - platform: "2026"
            cxx-standard: 20
            image: "aswf/ci-otio:2026@sha256:53aa78ae1951512cc1ad84c6deed932a1a4dff50740b82a6abf7a31f2715c071"
          - platform: "2027"
            cxx-standard: 20
            image: "aswf/ci-otio:2027@sha256:7b545f0e9151b802638448b07e7f3947622bb314f23a865f68ef46c8c6d8347a"

    container:
      image: ${{ matrix.image }}

    steps:
      # checkout *without* submodules, so we'll pick up the dependencies in the aswf containers
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Report platform toolchain
        run: |
          echo "VFX platform: ${ASWF_VFXPLATFORM_VERSION}"
          python --version
          gcc --version
          g++ --version
          cmake --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_STANDARD=${{ matrix.cxx-standard }} \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DOTIO_AUTOMATIC_SUBMODULES=OFF \
            -DOTIO_CXX_EXAMPLES=OFF \
            -DOTIO_DEPENDENCIES_INSTALL=OFF \
            -DOTIO_FIND_IMATH=ON \
            -DOTIO_FIND_PYBIND11=ON \
            -DOTIO_FIND_RAPIDJSON=ON \
            -DOTIO_FIND_MINIZIP_NG=ON \
            -DOTIO_PYTHON_INSTALL=ON \
            -DOTIO_PYTHON_INSTALL_DIR="$GITHUB_WORKSPACE/install/python"

      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Install and run consumer tests
        run: |
          cmake --install build
          cmake -S tests/consumer -B consumer-build \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install"

      - name: Verify Python bindings
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/install/python" \
            python -c 'import opentimelineio; print(opentimelineio.__file__)'

      - name: Run Python tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install "pip==25.2"
          export CMAKE_ARGS="-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_STANDARD=${{ matrix.cxx-standard }} -DOTIO_AUTOMATIC_SUBMODULES=OFF -DOTIO_CXX_EXAMPLES=OFF -DOTIO_DEPENDENCIES_INSTALL=OFF -DOTIO_FIND_IMATH=ON -DOTIO_FIND_PYBIND11=ON -DOTIO_FIND_RAPIDJSON=ON -DOTIO_FIND_MINIZIP_NG=ON"
          python -m pip install .
          make test
