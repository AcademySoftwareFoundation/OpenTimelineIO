# required by RTD
version: 2

sphinx:
  # Path to your Sphinx configuration file.
  configuration: docs/conf.py

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.13"

  jobs:
    install:
      - python -m pip install uv
      - UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH" uv sync --locked --no-default-groups --group docs --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python"

submodules:
  include: all
  recursive: true
