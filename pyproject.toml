[build-system]
# Setuptools 80.x supports Python 3.9; CMake 4.x breaks the Windows vcpkg ZLIB lookup.
requires = [
    "setuptools==80.10.2",
    "wheel==0.48.0",
    "cmake==3.31.10",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
